<!DOCTYPE html>
<!--
  Side by side, same width, same numbers, shown at half scale.

  Left:  NacViewer drawing the conduit home page (a 2x screenshot of the real
         client, laid out at 993 CSS pixels wide).
  Right: a browser drawing deploy/reference.html, which is the same sheet
         written as CSS by hand.

  Whatever still differs is the renderer: font hinting, subpixel antialiasing,
  the box model. It is not the layout values.
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>并排对照</title>
<style>
  html, body { margin: 0; padding: 0; background: #e9e9e9; font-family: sans-serif; }
  .wrap { display: flex; gap: 10px; padding: 8px; }
  .pane { width: 497px; height: 348px; overflow: hidden; }
  .pane h4 { margin: 0 0 4px; font: 12px sans-serif; color: #555; white-space: nowrap; }
  .scale { width: 993px; height: 640px; transform: scale(0.5); transform-origin: top left; }
  .scale img, .scale iframe { display: block; width: 993px; height: 640px; border: 0; }
  .scale img { object-fit: cover; object-position: top left; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pane">
      <h4>NacViewer（egui 画同一个样式表）</h4>
      <div class="scale"><img src="ours.png" alt="NacViewer"></div>
    </div>
    <div class="pane">
      <h4>Chrome（同样的数值，CSS 写的）</h4>
      <div class="scale"><iframe src="reference-local.html" scrolling="no"></iframe></div>
    </div>
  </div>
</body>
</html>
