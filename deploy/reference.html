<!DOCTYPE html>
<!--
  The same numbers as site-conduit/_lib/ui.py's sheet, written by hand in CSS.

  This file exists for one purpose: to see what a real browser does with the
  values Nac uses, so the difference between the two pictures is the renderer
  and nothing else. It is not part of any site.

  To open it, the fonts have to sit beside it (Chromium refuses to load a font
  from a parent directory over file://):

      mkdir deploy/fonts
      copy crates/viewer/assets/fonts/*.ttf deploy/fonts/

  then open deploy/reference.html with the path below pointed at ./fonts/, and
  put its screenshot next to deploy/ours.png in deploy/compare.html.
-->
